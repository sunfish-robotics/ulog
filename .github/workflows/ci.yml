name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.25.x
          - stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  pyulog:
    name: Interoperability (pyulog 1.2.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.2
      - run: python -m pip install --disable-pip-version-check uv==0.12.3
      - run: uv sync --frozen --project integration/pyulog
      - name: Test Go and pyulog interoperability
        env:
          ULOG_INTEROP_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/pyulog
        run: go test -tags=pyulog -run PyULog -count=1 -v .
      - name: Retain failing ULog files
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyulog-interoperability
          path: artifacts/pyulog
          if-no-files-found: ignore
